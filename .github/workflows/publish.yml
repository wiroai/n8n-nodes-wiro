# Publishes the package to npm with a provenance statement whenever a GitHub release is created.
# npm accepts the run through trusted publishing (GitHub Actions OIDC), so no token is stored here.
# `npm run release` (n8n-node release) lints, builds and publishes when it runs inside GitHub Actions.

name: Publish to npm

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install latest npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Lint, build and publish with provenance
        run: npm run release
